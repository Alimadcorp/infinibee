name: "Export Redot Game (Web, Windows, Linux)"

on:
  push:
    tags:
      - "v*"

jobs:
  export_all:
    runs-on: ubuntu-latest
    name: Build All Platforms
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Directories
        run: mkdir -p build/web build/windows build/linux

      - name: Download Redot Editor & Templates
        run: |
          # Use curl -L to correctly follow GitHub's download redirect mirrors
          curl -L "https://github.com" -o redot.zip
          unzip -q redot.zip
          
          # Make the standalone editor binary executable
          mv Redot_v4.3-stable_linux.x86_64 redot_bin
          chmod +x redot_bin

          # Setup and extract export templates directory
          mkdir -p ~/.local/share/redot/export_templates/4.3.stable/
          curl -L "https://github.com" -o templates.zip
          
          # Extract templates directly into the correct path structure
          unzip -q templates.zip -d ~/.local/share/redot/export_templates/4.3.stable/
          
          # Move files up if the tpz extracted into a nested "templates" folder
          if [ -d ~/.local/share/redot/export_templates/4.3.stable/templates ]; then
            mv ~/.local/share/redot/export_templates/4.3.stable/templates/* ~/.local/share/redot/export_templates/4.3.stable/
            rm -rf ~/.local/share/redot/export_templates/4.3.stable/templates
          fi

      - name: Export Web Build (index)
        run: |
          ./redot_bin --headless --export-release "Web" build/web/index.html

      - name: Export Windows Build
        run: |
          ./redot_bin --headless --export-release "Windows Desktop" build/windows/game.exe

      - name: Export Linux Build
        run: |
          ./redot_bin --headless --export-release "Linux/X11" build/linux/game.x86_64

      - name: Archive and Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/web/*
            build/windows/*
            build/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

