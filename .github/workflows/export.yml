name: "Export Redot Game (Web, Windows, Linux)"

on:
  push:
    tags:
      - "v*"

jobs:
  export_all:
    runs-on: ubuntu-latest
    name: Build All Platforms
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Directories
        run: mkdir -p build/web build/windows build/linux

      - name: Download Redot Editor & Templates
        run: |
          # Download Redot Headless Binary (LTS 26.2 Stable)
          curl -L "https://github.com" -o redot.zip
          unzip -q redot.zip
          
          # Rename the extracted binary to our script's shortcut name
          mv Redot_v26.2-stable_linux_x64 redot_bin
          chmod +x redot_bin

          # Setup export templates directory mapping Redot's format
          mkdir -p ~/.local/share/redot/export_templates/26.2.stable/
          curl -L "https://github.com" -o templates.zip
          
          # Unpack template files into place
          unzip -q templates.zip -d ~/.local/share/redot/export_templates/26.2.stable/
          
          # Adjust internal structures if templates extract nested
          if [ -d ~/.local/share/redot/export_templates/26.2.stable/templates ]; then
            mv ~/.local/share/redot/export_templates/26.2.stable/templates/* ~/.local/share/redot/export_templates/26.2.stable/
            rm -rf ~/.local/share/redot/export_templates/26.2.stable/templates
          fi

      - name: Export Web Build (index)
        run: |
          ./redot_bin --headless --export-release "Web" build/web/index.html

      - name: Export Windows Build
        run: |
          ./redot_bin --headless --export-release "Windows Desktop" build/windows/game.exe

      - name: Export Linux Build
        run: |
          ./redot_bin --headless --export-release "Linux/X11" build/linux/game.x86_64

      - name: Archive and Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/web/*
            build/windows/*
            build/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

